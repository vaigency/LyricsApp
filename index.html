<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyrics">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
<title>Подстрочник</title>
<style>
  :root {
    --bg: #0c0c0e;
    --ink: #ffffff;
    --soft: rgba(255,255,255,.62);
    --faint: rgba(255,255,255,.42);
    --de: #9cc8ff;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --ru: clamp(26px, 7.2vw, 46px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); transition: background-color .8s ease;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- header: title + artist, centred ---------- */
  header { position: fixed; inset: 0 0 auto 0; z-index: 5; text-align: center;
    padding: calc(14px + var(--safe-t)) 64px 26px;
    background: linear-gradient(var(--bg) 74%, transparent); transition: background .8s ease; }
  header .t { font-weight: 800; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .a { font-size: 14px; color: var(--soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { position: fixed; z-index: 6; top: calc(12px + var(--safe-t)); right: 14px; width: 40px; height: 40px;
    border-radius: 50%; border: 0; background: rgba(255,255,255,.1); display: grid; place-items: center; cursor: pointer; }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.left { right: auto; left: 14px; }
  .sync { display: inline-flex; vertical-align: -2px; margin-left: 6px; color: var(--soft); cursor: pointer; }
  .sync svg { display: block; }
  header .a { pointer-events: auto; }
  header .tt { font-size: 13px; color: var(--de); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .tt .tl { color: var(--soft); }
  body.no-lat header .tl, body.no-de header .td, body.no-lat header .dot, body.no-de header .dot { display: none; }

  /* library overview */
  .lib { position: fixed; inset: 0; z-index: 20; background: #0c0c0e; overflow: auto; transform: translateY(100%); transition: transform .28s ease; }
  .lib.open { transform: none; }
  .lib-head { position: sticky; top: 0; background: #0c0c0e; padding: calc(14px + var(--safe-t)) 16px 10px; display: flex; align-items: center; gap: 10px; z-index: 1; }
  .lib-head h2 { flex: 1; margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .lib-head small { display: block; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.5); letter-spacing: 0; }
  .lib-search { margin: 0 16px 6px; width: calc(100% - 32px); background: rgba(255,255,255,.08); border: 0; outline: 0; border-radius: 10px; padding: 10px 12px; }
  .song { display: flex; gap: 12px; align-items: center; padding: 10px 16px; cursor: pointer; }
  .song:active { background: rgba(255,255,255,.06); }
  .song .cv { width: 52px; height: 52px; border-radius: 4px; flex: none; object-fit: cover; background: rgba(255,255,255,.08); }
  .song .b { flex: 1; min-width: 0; }
  .song .st1 { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .st2 { font-size: 13px; color: var(--de); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .st2 .tl { color: rgba(255,255,255,.55); }
  .song .st3 { font-size: 13px; color: rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song.now .st1 { color: #1ed760; }
  .lib-sec { padding: 18px 16px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.45); }
  .status { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(94px + var(--safe-t));
    font-size: 13px; color: #fff; background: rgba(20,20,22,.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 999px;
    max-width: calc(100vw - 32px); text-align: center; transition: opacity .3s; }
  .status:empty { opacity: 0; }

  /* ---------- lyrics ---------- */
  main { max-width: 820px; margin: 0 auto; padding: calc(42vh) 22px 55vh; }
  .line { margin: 0 0 1.25em; font-size: var(--ru); opacity: .5; transition: opacity .35s ease; cursor: pointer; }
  .line.past { opacity: .32; }
  .line.active { opacity: 1; }
  .row { display: flex; flex-wrap: wrap; gap: .1em .38em; margin-bottom: .32em; }
  .w { display: inline-flex; flex-direction: column; align-items: flex-start; }
  .w .ru { font-weight: 800; letter-spacing: -.015em; line-height: 1.08; }
  .w .st { text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .14em; }
  .w .lat { font-size: .44em; font-weight: 500; color: var(--soft); line-height: 1.25; margin-top: .12em; }
  .w .de { font-size: .4em; font-weight: 400; color: var(--de); line-height: 1.25; position: relative; white-space: nowrap; }
  /* words of one fixed expression: the meaning sits on the first word, a line links the rest */
  .w .de.grp { color: transparent; align-self: stretch; }
  .w .de.grp::before { content: ""; position: absolute; left: -.75em; right: .1em; top: 58%; border-top: 2px solid var(--de); opacity: .55; border-radius: 2px; }
  .line.active .w { opacity: .62; transition: opacity .18s; }
  .line.active .w.sung { opacity: 1; }
  .line .tr { display: none; font-size: .44em; font-weight: 500; color: var(--de); margin-top: .35em; line-height: 1.3; }
  .line.active .tr { display: block; }
  body.no-lat .lat, body.no-de .de, body.no-de .tr { display: none !important; }
  .pause { font-size: var(--ru); margin: 0 0 1.25em; letter-spacing: .3em; opacity: .4; font-weight: 800; }
  .pause.active { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .empty { font-size: 20px; font-weight: 500; color: var(--soft); text-align: center; line-height: 1.5; }
  .unsynced .line { opacity: 1; cursor: default; }

  .ctrl { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; padding: 26px 22px calc(14px + var(--safe-b));
    background: linear-gradient(transparent, var(--bg) 38%); display: none; transition: background .8s ease; }
  body.playing-ui .ctrl { display: block; }
  .ctrl .inner { max-width: 520px; margin: 0 auto; }
  .bar { position: relative; height: 18px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .bar .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: #fff; border-radius: 4px; }
  .loopbtn { border: 0; background: none; color: var(--soft); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 12px; cursor: pointer; }
  .loopbtn.arm { color: #fff; background: rgba(255,255,255,.14); }
  .loopbtn.on { color: #0c0c0e; background: var(--de); }
  .line, .pause { position: relative; }
  .line.inloop::before, .pause.inloop::before, .line.loopmark::before { content: ""; position: absolute; left: -13px; top: .12em; bottom: .3em; width: 3px; border-radius: 3px; background: var(--de); }
  .line.loopmark::before { background: rgba(255,255,255,.75); }
  .times { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--soft); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .btns { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .btns .nudge { font-size: 13px; font-weight: 600; color: var(--soft); width: 52px; height: 36px; border-radius: 18px; background: rgba(255,255,255,.1); }
  .btns .nudge small { display: block; font-size: 10px; font-weight: 500; opacity: .75; margin-top: -1px; }
  .btns button { border: 0; background: none; color: #fff; padding: 6px; cursor: pointer; display: grid; place-items: center; }
  .btns .pp { width: 56px; height: 56px; border-radius: 50%; background: #fff; color: #000; }
  .btns button:active { transform: scale(.92); }
  main { padding-bottom: 60vh; }

  /* ---------- settings sheet ---------- */
  dialog { border: 0; padding: 0; margin: auto auto 0; width: min(560px, 100vw); max-height: 88dvh;
    border-radius: 22px 22px 0 0; background: #1a1a1d; color: var(--ink); }
  @media (min-width: 700px) { dialog { margin: auto; border-radius: 22px; } }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .sheet { padding: 10px 20px calc(24px + var(--safe-b)); }
  .grip { width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .06em; }
  .group { background: rgba(255,255,255,.06); border-radius: 14px; margin-bottom: 18px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid rgba(255,255,255,.07); min-height: 50px; }
  .item:last-child { border-bottom: 0; }
  .item > span { flex: 1; }
  .item small { display: block; color: rgba(255,255,255,.5); font-size: 12px; margin-top: 2px; }
  .switch { appearance: none; width: 46px; height: 28px; border-radius: 28px; background: rgba(255,255,255,.2); position: relative; cursor: pointer; transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch:checked { background: #1ed760; } .switch:checked::after { transform: translateX(18px); }
  .item input[type=password], .item input[type=search], .item select { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; text-align: right; color: rgba(255,255,255,.85); }
  .item select option { color: #000; }
  .pill { border: 0; background: rgba(255,255,255,.12); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .pill.green { background: #1ed760; color: #000; font-weight: 600; }
  .results .item { cursor: pointer; }
  .tiny { font-size: 12px; color: rgba(255,255,255,.45); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<header><div class="t" id="hTitle">Подстрочник</div><div class="tt" id="hTitleTr"></div><div class="a"><span id="hArtist">Russisch mitlesen</span><span class="sync" id="syncBadge"></span></div></header>
<button class="icon-btn left" id="btnLib" aria-label="Bibliothek">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4v16M9 4v16M14 5l5 15"/></svg>
</button>
<div class="lib" id="lib">
  <div class="lib-head"><h2>Bibliothek<small id="libCount"></small></h2>
    <button class="icon-btn" style="position:static" id="libClose" aria-label="Schließen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <input class="lib-search" id="libSearch" type="search" placeholder="Suchen">
  <div id="libList"></div>
</div>
<button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
</button>
<div class="status" id="status"></div>
<main id="lyrics"><div class="empty">Öffne oben rechts die Einstellungen<br>und verbinde Spotify.</div></main>
<div class="ctrl"><div class="inner">
  <div class="bar" id="bar"><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="times"><span id="tNow">0:00</span>
    <button class="loopbtn" id="btnLoop" aria-label="Schleife"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg><span id="loopLbl">Loop</span></button>
    <span id="tDur">0:00</span></div>
  <div class="btns">
    <button class="nudge" id="nudgeMinus" aria-label="Text eine Viertelsekunde später">−¼ s</button>
    <button id="btnPrev" aria-label="Vorheriger Song"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="pp" id="btnPlay" aria-label="Play/Pause"></button>
    <button id="btnNext" aria-label="Nächster Song"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="nudge" id="nudgePlus" aria-label="Text eine Viertelsekunde früher">+¼ s</button>
  </div>
</div></div>

<dialog id="settings">
  <div class="sheet">
    <div class="grip"></div>
    <h3>Anzeige</h3>
    <div class="group">
      <label class="item"><span>Aussprache<small>Russisch in lateinischen Buchstaben</small></span><input type="checkbox" class="switch" id="optLat"></label>
      <label class="item"><span>Übersetzung<small>Deutsche Bedeutung pro Wort und Zeile</small></span><input type="checkbox" class="switch" id="optDe"></label>
      <label class="item"><span>Farbe vom Album-Cover<small>wie bei Spotify; aus = Dark Mode</small></span><input type="checkbox" class="switch" id="optCover"></label>
    </div>
    <h3>Verbindung</h3>
    <div class="group">
      <div class="item"><span>Spotify<small id="spState">nicht verbunden</small></span><button class="pill green" id="btnSpotify">Verbinden</button></div>
      <label class="item"><span>Zugangscode<small id="libState">Playlist-Übersetzungen ohne API Key</small></span><input type="password" id="sCode" placeholder="Code" autocomplete="off"></label>
      <label class="item"><span>Claude Key<small>nur für Songs außerhalb der Playlist</small></span><input type="password" id="sKey" placeholder="sk-ant-…" autocomplete="off"></label>
      <label class="item"><span>Modell</span><select id="sModel">
        <option value="claude-opus-5-5">Opus 5.5</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5</option>
        <option value="claude-haiku-5-5">Haiku 5.5</option>
      </select></label>
    </div>
    <h3>Timing</h3>
    <div class="group">
      <div class="item"><span>Synchron-Punkte für diesen Song<small id="kfInfo">Zeile lange drücken, mit ±¼ s feinjustieren</small></span>
        <button class="pill" id="kfReset">Zurücksetzen</button></div>
    </div>
    <h3>Ohne Spotify</h3>
    <div class="group">
      <label class="item"><span>Suchen</span><input type="search" id="q" placeholder="z. B. Vintage Eva" enterkeyhint="search"></label>
      <div class="results" id="results"></div>
    </div>
    <p class="tiny"><span id="cacheInfo"></span> · <a href="#" id="btnClearCache" style="color:inherit">Übersetzungen löschen</a></p>
  </div>
</dialog>

<script>
"use strict";
const SPOTIFY_CLIENT_ID = "494e353046cc4d5caf383ef90d21ab60";

/* ---------- storage ---------- */
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn("storage", e); } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
  keys(p) { try { return Object.keys(localStorage).filter(k => k.startsWith(p)); } catch { return []; } },
};
const cfg = Object.assign({ apiKey: "", model: "claude-opus-5-5", offsetMs: 0, lat: true, de: true, cover: true }, store.get("cfg", {}));
const saveCfg = () => store.set("cfg", cfg);
let statusTimer;
function setStatus(msg, sticky = false) { const s = $("#status"); s.textContent = msg || ""; clearTimeout(statusTimer); if (msg && !sticky) statusTimer = setTimeout(() => s.textContent = "", 6000); }
const fmt = (ms) => { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- fallback transliteration until Claude's pronunciation arrives ---------- */
const TR = { а:"a",б:"b",в:"w",г:"g",д:"d",е:"e",ё:"jo",ж:"sch",з:"s",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"ch",ц:"z",ч:"tsch",ш:"sch",щ:"schtsch",ъ:"",ы:"y",ь:"",э:"e",ю:"ju",я:"ja" };
const VOW = "аеёиоуыэюя";
function translit(word) {
  let out = "", prev = "";
  for (const ch of word.normalize("NFC")) {
    const lo = ch.toLowerCase(); let t = TR[lo];
    if (t === undefined) { out += ch; prev = lo; continue; }
    if (lo === "е" && (prev === "" || VOW.includes(prev) || prev === "ь" || prev === "ъ")) t = "je";
    if (ch !== lo && t) t = t[0].toUpperCase() + t.slice(1);
    out += t; prev = lo;
  }
  return out;
}
const syllables = (w) => Math.max(1, [...w.toLowerCase()].filter(c => VOW.includes(c)).length);
function stressHtml(w) {
  const chars = [...(w || "").normalize("NFD")]; let html = "";
  for (let i = 0; i < chars.length; i++) {
    if (chars[i] === "́") continue;
    let c = chars[i];
    if (chars[i + 1] === "̆" || chars[i + 1] === "̈") { c = (c + chars[i + 1]).normalize("NFC"); i++; }
    html += chars[i + 1] === "́" ? `<span class="st">${esc(c)}</span>` : esc(c);
  }
  return html;
}

/* ---------- playback clock ---------- */
const clock = {
  source: "none", baseMs: 0, basePerf: 0, playing: false, durationMs: 0,
  raw() { return this.playing ? this.baseMs + performance.now() - this.basePerf : this.baseMs; },   // position in the recording
  now() { const r = this.raw(); return r + cfg.offsetMs + offAt(r); },                                    // position in the lyric file
  set(ms, playing) { this.baseMs = ms; this.basePerf = performance.now(); this.playing = playing; },
};

/* ---------- per-song timing keyframes ----------
   Every correction leaves a keyframe [songPosition, offset]. Between two keyframes the offset changes —
   inside the longest instrumental gap if there is one (an interlude of different length), otherwise gradually.
   Before the first / after the last keyframe the offset stays constant. Saved per song under "kf:<track>". */
let kfs = [];
function loadKeyframes(key) {
  kfs = store.get("kf:" + key, null);
  if (!kfs) { const old = store.get("off:" + key, 0); kfs = old ? [[0, old]] : []; }   // migrate old single offset
}
const saveKeyframes = () => { if (current.key) store.set("kf:" + current.key, kfs); };
/* A series of ±1 s presses is ONE correction: it applies live but is only saved as a keyframe
   once the presses stop (4 s after the last one), at the position of the last press. */
let pending = null, pendingTimer = null;
function activeKfs() {
  if (!pending) return kfs;
  return [...kfs.filter(([x]) => Math.abs(x - pending[0]) > 8000), pending].sort((a, b) => a[0] - b[0]);
}
function offAt(r) {
  const K = activeKfs();
  if (!K.length) return 0;
  if (r <= K[0][0]) return K[0][1];
  const last = K[K.length - 1]; if (r >= last[0]) return last[1];
  let j = 0; while (K[j + 1][0] < r) j++;
  const [r1, o1] = K[j], [r2, o2] = K[j + 1];
  let a = r1, b = r2;                       // window in which the offset moves from o1 to o2
  const g = cfg.offsetMs, its = (current.items || []).filter(x => !x.pause);
  let best = 0;
  for (let k = 0; k + 1 < its.length; k++) {   // longest gap between sung lines inside [r1, r2] (song time)
    const end = its[k].t + Math.min(its[k + 1].t - its[k].t, syllablesOf(its[k].words) * 450 + 800) - g - o1;
    const nxt = its[k + 1].t - g - o2;
    if (end >= r1 && nxt <= r2 && nxt - end > best) { best = nxt - end; a = end; b = nxt; }
  }
  if (best < 4000) { a = r1; b = r2; }
  if (r <= a) return o1; if (r >= b) return o2;
  return o1 + (o2 - o1) * (r - a) / (b - a);
}
function commitPending() {
  clearTimeout(pendingTimer); if (!pending) return;
  const [r, off] = pending; pending = null; setKeyframe(r, off);
  setStatus(`Synchron-Punkt gespeichert: ${fmt(r)} ${fmtOff(off)}`);
}
function setKeyframe(r, off) {
  r = Math.max(0, Math.round(r)); off = Math.round(off);
  kfs = kfs.filter(([x]) => Math.abs(x - r) > 8000);          // a nearby keyframe is replaced
  kfs.push([r, off]); kfs.sort((x, y) => x[0] - y[0]); saveKeyframes(); current.idx = -2; updateBadge();
}
const fmtOff = (o) => (o >= 0 ? "+" : "") + (o / 1000).toFixed(2).replace(".", ",") + " s";

/* ---------- Spotify (PKCE) ---------- */
const REDIRECT = location.origin + location.pathname;
const SCOPES = "user-read-currently-playing user-read-playback-state user-modify-playback-state";
let tok = store.get("sp_tok", null);
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
async function spotifyLogin() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("sp_verifier", verifier);
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, response_type: "code",
    redirect_uri: REDIRECT, code_challenge_method: "S256", code_challenge: challenge, scope: SCOPES });
}
async function tokenRequest(params) {

    headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, ...params }) });
  const j = await r.json();
  if (!r.ok) { if (params.grant_type === "refresh_token") { tok = null; store.del("sp_tok"); updateSpState(); } throw new Error(j.error_description || j.error || "Token-Fehler"); }
  tok = { access: j.access_token, refresh: j.refresh_token || tok?.refresh, exp: Date.now() + (j.expires_in - 60) * 1000 };
  store.set("sp_tok", tok);
}

  if (q.get("code")) {
    try { await tokenRequest({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT, code_verifier: store.get("sp_verifier", "") }); }
    catch (e) { setStatus("Spotify-Login fehlgeschlagen: " + e.message, true); }

}

  const r = await fetch("https://api.spotify.com/v1" + path, { ...opts, headers: { Authorization: "Bearer " + tok.access, ...(opts.headers || {}) } });
  if (r.status === 401) { tok.exp = 0; throw new Error("Spotify-Token abgelaufen"); }
  if (r.status === 204) return null;
  if (!r.ok) { let m = r.status; try { m = (await r.json()).error?.message || m; } catch {} throw new Error("Spotify: " + m); }

  try { return t ? JSON.parse(t) : null; } catch { return null; }
}
const metaOf = (it) => ({ key: "sp:" + it.id, ids: [it.id, it.linked_from?.id].filter(Boolean), title: it.name, artist: it.artists.map(a => a.name).join(", "),
  firstArtist: it.artists[0]?.name || "", album: it.album?.name || "", durationMs: it.duration_ms,
  image: it.album?.images?.at(-1)?.url || it.album?.images?.[0]?.url || "" });

let pollTimer = null, lastQueueCheck = "", ignorePollUntil = 0;
async function pollSpotify() {
  if (document.hidden) return;
  try {
    const t0 = performance.now();
    const cp = await sp("/me/player/currently-playing");
    const rtt = performance.now() - t0;
    if (!cp || !cp.item || cp.currently_playing_type !== "track") {
      if (clock.source === "spotify") clock.playing = false;
      if (!current.key) showEmpty("Starte einen Song in Spotify.");
      return;
    }
    clock.source = "spotify"; document.body.classList.remove("local");
    document.body.classList.add("playing-ui");
    clock.durationMs = cp.item.duration_ms;
    if (performance.now() > ignorePollUntil) clock.set(cp.progress_ms + (cp.is_playing ? Math.min(rtt / 2, 400) : 0), cp.is_playing);
    const meta = metaOf(cp.item);
    if (meta.key !== current.key) { loadTrack(meta); prefetchNext(meta.key); }
  } catch (e) { setStatus(e.message); }
}
async function prefetchNext(key) {
  if (lastQueueCheck === key || !cfg.apiKey) return; lastQueueCheck = key;
  try {
    const it = (await sp("/me/player/queue"))?.queue?.[0];
    if (!it?.id || it.type !== "track") return;
    const meta = metaOf(it); if (libEntry(meta)) return;
    const lyr = await findLyrics(meta);
    if (lyr?.lines?.length) await glossLyrics(meta, lyr);
  } catch (e) { console.warn("prefetch", e); }
}
function startPolling() { updateSpState(); clearInterval(pollTimer); pollSpotify(); pollTimer = setInterval(pollSpotify, 1500); }
function updateSpState() { $("#spState").textContent = tok ? "verbunden" : "nicht verbunden"; $("#btnSpotify").textContent = tok ? "Neu verbinden" : "Verbinden"; }

addEventListener("pagehide", () => commitPending());

/* ---------- background colour from the album cover (like Spotify's lyrics view) ---------- */
const DARK = "#0c0c0e";
function applyBg(c) { document.documentElement.style.setProperty("--bg", c); document.querySelector('meta[name="theme-color"]').content = c; }
function setBackground(url) {
  if (!cfg.cover || !url) return applyBg(DARK);
  const img = new Image(); img.crossOrigin = "anonymous";
  img.onload = () => {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 24; const x = c.getContext("2d");
      x.drawImage(img, 0, 0, 24, 24); const d = x.getImageData(0, 0, 24, 24).data;
      // bucket pixels by hue, weight by saturation: the dominant colourful hue wins, not a muddy average
      const buckets = Array.from({ length: 24 }, () => ({ w: 0, s: 0 }));
      for (let i = 0; i < d.length; i += 4) {
        const [h, s, l] = rgbToHsl(d[i], d[i + 1], d[i + 2]);
        if (l < 8 || l > 92) continue;
        const b = buckets[Math.floor(h / 15) % 24], w = s / 100 * (1 - Math.abs(l - 50) / 60);
        b.w += w; b.s += s * w;
      }
      const top = buckets.reduce((a, b, i) => b.w > a.b.w ? { i, b } : a, { i: 0, b: buckets[0] });
      if (top.b.w < 3) return applyBg("hsl(0 0% 16%)");                 // grey cover → neutral dark grey
      const sat = Math.min(60, Math.max(30, top.b.s / top.b.w));
      applyBg(`hsl(${top.i * 15 + 7} ${Math.round(sat)}% 26%)`);
    } catch { applyBg(DARK); }
  };
  img.onerror = () => applyBg(DARK); img.src = url;
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, s = 0;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s * 100, l * 100];
}

/* ---------- lyrics (LRCLIB) ---------- */
const LRCLIB = "https://lrclib.net/api";
function parseLRC(lrc) {
  const lines = [];
  for (const raw of (lrc || "").split(/\r?\n/)) {
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if (!stamps.length) continue;
    const text = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const m of stamps) lines.push({ t: Math.round((+m[1] * 60 + parseFloat(m[2].replace(":", "."))) * 1000), text });
  }
  return lines.sort((a, b) => a.t - b.t);
}
const cleanTitle = (t) => t.replace(/\s*[-–]\s*(remaster|live|version|radio|edit|mono|stereo).*$/i, "").replace(/\s*[\(\[](feat|ft|remaster|live|prod)[^\)\]]*[\)\]]/ig, "").trim();
const recToLyrics = (x) => ({ id: x.id, instrumental: !!x.instrumental, synced: !!x.syncedLyrics,
  lines: x.syncedLyrics ? parseLRC(x.syncedLyrics) : (x.plainLyrics || "").split(/\r?\n/).map((text, i) => ({ t: i * 4000, text: text.trim() })) });
async function findLyrics(m) {

  if (cached) return cached;

  const q = async (path, params) => { try { const r = await fetch(`${LRCLIB}/${path}?` + new URLSearchParams(params)); return r.ok ? r.json() : null; } catch { return null; } };
  // collect candidates from three searches, then score them
  const [exact, byArtist, byTitle] = await Promise.all([
    q("get", { track_name: m.title, artist_name: first, album_name: m.album, duration: Math.round(dur) }),
    q("search", { track_name: title, artist_name: first }),
    q("search", { q: title }),
  ]);
  const seen = new Set(), cands = [];
  for (const x of [exact, ...(byArtist || []), ...(byTitle || [])]) if (x?.id && !seen.has(x.id) && (x.syncedLyrics || x.plainLyrics || x.instrumental)) { seen.add(x.id); cands.push(x); }

  const cyrMeta = /[а-яё]/i.test([m.title, m.artist, m.album].join(" "));

    const d = Math.abs(x.duration - dur), text = x.syncedLyrics || x.plainLyrics || "", ca = norm(x.artistName);
    const hits = Math.min(3, artists.filter(a => ca.includes(a) || (ca.length > 2 && a.includes(ca))).length);

    const cyrText = /[а-яё]/i.test(text);
    return hits * 25                                                   // more of the track's artists named = more likely the original
      + (cyrMeta ? (cyrText ? 40 : -20) : 0)

  const out = recToLyrics(best); store.set(ck, out); return out;
}

/* ---------- word-by-word translation via Claude ---------- */
const SYSTEM = `Du hilfst deutschsprachigen Russisch-Anfängern, Songtexte beim Hören mitzulesen. Sie kennen das kyrillische Alphabet, lesen aber noch langsam.
Für jede Eingabezeile:
- "de": natürliche, sinngemäße deutsche Übersetzung der ganzen Zeile.
- "words": JEDES Wort der Zeile in Original-Reihenfolge, ohne Satzzeichen und Klammern (Bindestrich-Wörter wie что-то bleiben ein Wort):
  - "ru": das Wort exakt wie im Text geschrieben.
  - "stress": dasselbe Wort mit Betonungszeichen U+0301 direkt nach dem betonten Vokal (bei einsilbigen Wörtern und bei ё keins).
  - "lat": die Aussprache in deutscher Schreibweise, so wie ein Deutscher sie lesen würde: w, s, sch, tsch, schtsch, ch, z, j (ja, je, jo, ju). Schreib, wie es tatsächlich klingt (unbetontes o wie a: молоко → malakó; его → jewó; что → schto; сегодня → sewódnja), den betonten Vokal mit Akut (á é í ó ú ý).
  - "de": Bedeutung des Wortes in DIESEM Kontext, 1–3 Wörter. Feste Wendungen: Bedeutung beim ersten Wort, bei den folgenden "↑".
- "i": die Zeilennummer aus der Eingabe.
"summary": 2–3 Sätze auf Deutsch: worum es im Song geht und welche Stimmung er hat.
"title_lat" / "title_de": Aussprache (wie bei "lat") und deutsche Übersetzung des Songtitels; leer, wenn der Titel nicht russisch ist.
Gib für jede Eingabezeile genau einen Eintrag zurück. Nicht-russische Zeilen trotzdem übersetzen.`;
const SCHEMA = { type: "object", additionalProperties: false, required: ["summary", "title_lat", "title_de", "lines"], properties: {
  summary: { type: "string" }, title_lat: { type: "string" }, title_de: { type: "string" },
  lines: { type: "array", items: { type: "object", additionalProperties: false, required: ["i", "de", "words"], properties: {
    i: { type: "integer" }, de: { type: "string" },
    words: { type: "array", items: { type: "object", additionalProperties: false, required: ["ru", "stress", "lat", "de"],
      properties: { ru: { type: "string" }, stress: { type: "string" }, lat: { type: "string" }, de: { type: "string" } } } } } } } } };
async function callClaude(meta, chunk) {
  const model = cfg.model;
  const body = { model, max_tokens: 16000, output_config: { effort: "low", format: { type: "json_schema", schema: SCHEMA } }, system: SYSTEM,
    messages: [{ role: "user", content: `Song: "${meta.title}" – ${meta.artist}\n\nZeilen:\n` + chunk.map(([i, t]) => `${i}\t${t}`).join("\n") }] };
  const headers = { "content-type": "application/json", "x-api-key": cfg.apiKey, "anthropic-version": "2026-10-21", "anthropic-dangerous-direct-browser-access": "true" };
  if (model === "claude-opus-5-5" || model === "claude-sonnet-5-5") { headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; body.fallbacks = "default"; }
  const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error("Claude: " + (j.error?.message || r.status));
  if (j.stop_reason === "refusal") throw new Error("Claude hat diesen Text abgelehnt");
  if (j.stop_reason === "max_tokens") throw new Error("Übersetzung abgeschnitten");
  return JSON.parse((j.content || []).filter(b => b.type === "text").map(b => b.text).join(""));
}
const inflight = {};
function glossLyrics(meta, lyrics, onProgress) {
  const ck = "gloss2:" + (lyrics.id ?? meta.key), cached = store.get(ck, null);
  if (cached) return Promise.resolve(cached);
  if (!cfg.apiKey) return Promise.reject(new Error("Für Übersetzungen den Claude Key in den Einstellungen eintragen"));
  return inflight[ck] ??= (async () => {
    try {
      const uniq = [...new Set(lyrics.lines.map(l => l.text).filter(t => t && /\p{L}/u.test(t)))];
      const idx = uniq.map((t, i) => [i, t]), chunks = [];
      for (let i = 0; i < idx.length; i += 35) chunks.push(idx.slice(i, i + 35));
      let done = 0;
      const res = await Promise.all(chunks.map(c => callClaude(meta, c).then(r => { onProgress?.(++done, chunks.length); return r; })));
      const byText = {};
      for (const r of res) for (const l of r.lines) if (uniq[l.i] != null) byText[uniq[l.i]] = { de: l.de, words: l.words };
      const out = { summary: res.map(r => r.summary).find(Boolean) || "", titleLat: res[0]?.title_lat || "", titleDe: res[0]?.title_de || "", byText };
      store.set(ck, out); return out;
    } finally { delete inflight[ck]; }
  })();
}

/* ---------- pre-translated playlist library (encrypted, unlocked with an access code) ---------- */
const library = { map: null, count: 0 };
async function unlockLibrary(code) {
  if (!code) return false;
  try {
    const buf = new Uint8Array(await (await fetch("library.enc", { cache: "no-cache" })).arrayBuffer());
    const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    const json = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    library.map = JSON.parse(json); library.count = Object.keys(library.map).length;
    $("#libState").textContent = library.count + " Songs freigeschaltet";
    return true;
  } catch (e) { console.warn("library", e); $("#libState").textContent = "Code falsch oder Bibliothek nicht erreichbar"; return false; }
}
const libEntry = (meta) => library.map && (meta.ids || []).map(id => library.map[id]).find(Boolean);

/* ---------- track loading ---------- */
const current = { key: null, meta: null, lyrics: null, gloss: null, items: [], idx: -2, loadId: 0 };

  const id = ++current.loadId;

  Object.assign(current, { key: meta.key, meta, lyrics: null, gloss: null, idx: -2 }); loadKeyframes(meta.key);
  $("#hTitle").textContent = meta.title; $("#hArtist").textContent = meta.artist; showTitleTr("", "");
  setBackground(meta.image); showEmpty("Suche Liedtext …"); setStatus("");
  window.scrollTo({ top: 0 });
  const lib = libEntry(meta);
  if (lib) {
    current.lyrics = estimateTiming({ id: "lib", synced: lib.synced, lines: lib.lines.map(([t, text]) => ({ t, text })) }, meta.durationMs);
    current.gloss = { summary: lib.summary, byText: lib.byText }; showTitleTr(lib.titleLat, lib.titleDe); render(); markNow(); return;
  }

  if (id !== current.loadId) return;

/* lyrics without timestamps: spread the lines over the song by syllables (intro/outro left free) */
function estimateTiming(lyrics, dur) {
  if (lyrics.synced) return lyrics;
  const L = lyrics.lines; if (!dur) dur = L.length * 3500 + 25000;
  const start = Math.min(20000, Math.max(6000, dur * 0.07)), stop = dur - Math.min(15000, Math.max(4000, dur * 0.05));
  const w = L.map(l => l.text ? 2 + l.text.split(/\s+/).reduce((a, x) => a + syllables(x), 0) : 6), total = w.reduce((a, b) => a + b, 0);
  let acc = 0;
  return { ...lyrics, synced: true, estimated: true, lines: L.map((l, i) => { const t = start + (stop - start) * acc / total; acc += w[i]; return { t: Math.round(t), text: l.text }; }) };
}

/* ---------- rendering: lines split into rows of max 5 words ---------- */
function wordsFor(text) {
  const g = current.gloss?.byText?.[text];
  if (g?.words?.length) return g.words;
  return text.split(/\s+/).map(w => w.replace(/^[^\p{L}\d]+|[^\p{L}\d]+$/gu, "")).filter(Boolean).map(w => ({ ru: w, stress: w, lat: translit(w), de: "" }));
}

    const words = wordsFor(l.text), de = current.gloss?.byText?.[l.text]?.de || "";
    items.push({ t: l.t, i, words });
    html += `<div class="line" data-k="${items.length - 1}">` + rowsOf(words).map(r => `<div class="row">` + r.map(w =>
      `<span class="w"><span class="ru">${stressHtml(w.stress || w.ru)}</span><span class="lat">${esc(w.lat || translit(w.ru))}</span>${isCont(w) ? `<span class="de grp"> </span>` : `<span class="de">${esc(w.de || " ")}</span>`}</span>`).join("") + `</div>`).join("")
      + (de ? `<div class="tr">${esc(de)}</div>` : "") + `</div>`;
    // long instrumental gap after this line → show a pause marker
    let markedPause = false; for (let j = i + 1; j < L.length && !isText(L[j].text); j++) if (isPause(j)) markedPause = true;
    if (synced && next - l.t > 12000 && !markedPause) { const t = l.t + Math.max(4000, syllablesOf(words) * 450 + 1500); items.push({ t, pause: true }); html += `<div class="pause" data-k="${items.length - 1}">• • •</div>`; }
  });
  current.items = items; current.idx = -2; updateBadge(); paintLoop();
  const main = $("#lyrics"); main.innerHTML = html; main.classList.toggle("unsynced", !synced);
  main.querySelectorAll("[data-k]").forEach(el => {
    let timer = null, long = false;
    el.addEventListener("pointerdown", () => { long = false; timer = setTimeout(() => { long = true; syncTo(items[+el.dataset.k].t); }, 550); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, () => clearTimeout(timer)));
    el.addEventListener("contextmenu", (e) => e.preventDefault());
    el.onclick = () => { if (long) return; if (loop.state === "pickIn" || loop.state === "pickOut") return pickLoop(+el.dataset.k); if (synced) seekTo(items[+el.dataset.k].t + 1); };
  });
  if (current.lyrics.estimated) setStatus("Timing geschätzt – gesungene Zeile lange drücken, die App merkt es sich", true);
}
const isCont = (w) => /^\s*[↑^]\s*$/.test(w.de || "");
const syllablesOf = (words) => words.reduce((a, w) => a + syllables(w.ru), 0);

/* ---------- karaoke loop ---------- */
let userScrollUntil = 0;
["wheel", "touchmove"].forEach(ev => addEventListener(ev, () => userScrollUntil = performance.now() + 4000, { passive: true }));
function findItem(t) { const it = current.items; let lo = 0, hi = it.length - 1, a = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (it[m].t <= t) { a = m; lo = m + 1; } else hi = m - 1; } return a; }
let lastPlayIcon = null;
/* ---------- repeat loop (A–B): In = start of the first chosen line, Out = end of the last one ---------- */
const loop = { state: "off", a: -1, b: -1, inT: 0, outT: 0, count: 0, cool: 0 };
function lineEnd(k) {                 // when line k is over: next item start, but not through a long instrumental gap
  const it = current.items, nx = it[k + 1]?.t ?? clock.durationMs;
  const est = it[k].t + (it[k].words ? syllablesOf(it[k].words) * 450 : 0) + 1500;
  return nx - it[k].t > 8000 ? Math.min(nx, Math.max(est, it[k].t + 3000)) : nx;
}
function pickLoop(k) {
  if (current.items[k]?.pause) return;
  if (loop.state === "pickIn") { loop.a = k; loop.state = "pickOut"; setStatus("Jetzt die letzte Zeile antippen (dieselbe = nur diese Zeile)", true); paintLoop(); return; }
  loop.b = Math.max(k, loop.a); loop.a = Math.min(k, loop.a);
  loop.inT = current.items[loop.a].t - 300; loop.outT = lineEnd(loop.b); loop.count = 0; loop.state = "on";
  const n = loop.b - loop.a + 1;
  setStatus(`Schleife: ${n === 1 ? "1 Zeile" : n + " Zeilen"} · Loop-Button beendet sie`); paintLoop(); seekTo(loop.inT);
  if (!clock.playing) togglePlay();
}
function stopLoop(silent) { if (loop.state === "off") return; loop.state = "off"; paintLoop(); if (!silent) setStatus("Schleife beendet"); }
function paintLoop() {
  const btn = $("#btnLoop"); btn.classList.toggle("arm", loop.state === "pickIn" || loop.state === "pickOut"); btn.classList.toggle("on", loop.state === "on");
  $("#loopLbl").textContent = loop.state === "on" ? (loop.count ? `${loop.count + 1}×` : "Loop an") : loop.state === "off" ? "Loop" : "Zeilen wählen";
  const els = $("#lyrics").children;
  for (let j = 0; j < els.length; j++) {
    els[j].classList.toggle("inloop", loop.state === "on" && j >= loop.a && j <= loop.b);
    els[j].classList.toggle("loopmark", loop.state === "pickOut" && j === loop.a);
  }
}
$("#btnLoop").onclick = () => {
  if (loop.state !== "off") return stopLoop();
  if (!current.lyrics?.synced) return setStatus("Schleife braucht Zeilen mit Timing");
  loop.state = "pickIn"; paintLoop(); setStatus("Schleife: erste Zeile antippen", true);
};
function checkLoop(t) {                // called every frame with the lyric time
  if (loop.state !== "on" || performance.now() < loop.cool) return;
  if (t >= loop.outT || t < loop.inT - 4000) {
    loop.cool = performance.now() + 1200; loop.count++; seekTo(loop.inT); paintLoop();
  }
}

function tick() {
  if (clock.durationMs) {
    const r = Math.min(clock.durationMs, Math.max(0, rawPos()));
    if (!window.barDragging?.()) $("#fill").style.width = (100 * r / clock.durationMs) + "%";
    $("#tNow").textContent = fmt(r); $("#tDur").textContent = fmt(clock.durationMs);
  }
  if (lastPlayIcon !== clock.playing) { lastPlayIcon = clock.playing; $("#btnPlay").innerHTML = clock.playing ? PAUSE : PLAY; }
  if (current.lyrics?.synced && current.items.length) {
    const t = clock.now(), k = findItem(t), els = $("#lyrics").children;
    if (clock.playing) checkLoop(t);
    if (k !== current.idx) {
      current.idx = k;
      for (let j = 0; j < els.length; j++) { els[j].classList.toggle("active", j === k); els[j].classList.toggle("past", j < k); }
      const el = els[Math.max(0, k)];
      if (el && performance.now() > userScrollUntil) window.scrollTo({ top: el.offsetTop - innerHeight * 0.32, behavior: "smooth" });
    }
    const item = current.items[k];
    if (item && !item.pause && item.words.length) {     // estimated word timing inside the active line
      const next = current.items[k + 1]?.t ?? clock.durationMs, total = syllablesOf(item.words);
      const t1 = Math.min(next - 150, item.t + Math.max(1500, total * 450));
      let acc = 0; const ws = els[k].querySelectorAll(".w");
      item.words.forEach((w, n) => { const s = item.t + (t1 - item.t) * acc / total; ws[n]?.classList.toggle("sung", t >= s); acc += syllables(w.ru); });
    }
  }
  requestAnimationFrame(tick);
}

/* ---------- controls ---------- */
const PLAY = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
const rawPos = () => clock.raw();
function lyricToRaw(ms) { let r = ms - cfg.offsetMs; for (let i = 0; i < 3; i++) r = ms - cfg.offsetMs - offAt(r); return r; }
const spCmd = (path, method = "PUT") => sp(path, { method }).catch(e => setStatus(e.message.includes("Premium") ? "Steuerung braucht Spotify Premium" : e.message));
async function seekRaw(ms) {          // ms = position in the recording
  ms = Math.max(0, Math.round(ms)); clock.set(ms, clock.playing); userScrollUntil = 0; ignorePollUntil = performance.now() + 1500;
  if (clock.source === "spotify") await spCmd(`/me/player/seek?position_ms=${ms}`);
}
const seekTo = (lyricMs) => seekRaw(lyricToRaw(lyricMs));
function syncTo(lineT) {              // the user says: this line is being sung right now
  clearTimeout(pendingTimer); pending = null;
  const r = clock.raw(), off = lineT + 120 - r - cfg.offsetMs; setKeyframe(r, off);
  setStatus(`Synchron-Punkt gesetzt (${fmtOff(off)}) – wird für diesen Song gespeichert`);
  navigator.vibrate?.(30);
}
function togglePlay() {
  const was = clock.playing; clock.set(rawPos(), !was); ignorePollUntil = performance.now() + 1500;
  if (clock.source === "spotify") spCmd(`/me/player/${was ? "pause" : "play"}`);
}
async function skip(dir) {
  if (clock.source === "local") { seekRaw(dir > 0 ? clock.durationMs : 0); return; }
  if (dir < 0 && rawPos() > 3000) { seekRaw(0); return; }      // like Spotify: back = restart song first
  await spCmd(`/me/player/${dir > 0 ? "next" : "previous"}`, "POST");
  setTimeout(pollSpotify, 350); setTimeout(pollSpotify, 1000);
}
$("#btnPlay").onclick = togglePlay;
function nudge(ms) {                  // + = text comes earlier, − = later; saved for this song
  const r = clock.raw(), off = offAt(r) + ms;
  pending = [Math.round(r), Math.round(off)]; current.idx = -2;
  clearTimeout(pendingTimer); pendingTimer = setTimeout(commitPending, 4000);
  setStatus(`Timing ${fmtOff(off)} …`, true);
}
$("#nudgeMinus").onclick = () => nudge(-250);
$("#nudgePlus").onclick = () => nudge(250);
$("#btnNext").onclick = () => skip(1);
$("#btnPrev").onclick = () => skip(-1);
/* progress bar: tap or drag to seek */
(() => {
  const bar = $("#bar"); let drag = false;
  const pos = (e) => Math.min(1, Math.max(0, (e.clientX - bar.getBoundingClientRect().left) / bar.offsetWidth));
  bar.addEventListener("pointerdown", (e) => { drag = true; bar.setPointerCapture(e.pointerId); $("#fill").style.width = pos(e) * 100 + "%"; });
  bar.addEventListener("pointermove", (e) => { if (drag) $("#fill").style.width = pos(e) * 100 + "%"; });
  bar.addEventListener("pointerup", (e) => { if (!drag) return; drag = false; seekRaw(pos(e) * clock.durationMs); });
  window.barDragging = () => drag;
})();
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select")) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); } else if (e.key === "ArrowRight") skip(1); else if (e.key === "ArrowLeft") skip(-1);
});
let wakeLock = null;
async function requestWakeLock() { try { if ("wakeLock" in navigator && !document.hidden && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch {} }

/* ---------- library overview ---------- */
const PLAYLIST_URI = "spotify:playlist:6Oircds2P3DI8DJ976IC3w";
function libSongs() {
  const lib = Object.entries(library.map || {}).map(([id, e]) => ({ id, ...e, inLib: true })).sort((a, b) => a.order - b.order);
  const mine = Object.entries(store.get("mysongs", {})).filter(([id]) => !library.map?.[id]).map(([id, e]) => ({ id, ...e })).sort((a, b) => b.at - a.at);
  return { lib, mine };
}
function songRow(x, n) {
  const tr = (x.titleLat || x.titleDe) ? `<div class="st2"><span class="tl">${esc(x.titleLat)}</span>${x.titleLat && x.titleDe ? " · " : ""}${esc(x.titleDe)}</div>` : "";
  const cv = x.cover ? `<img class="cv" src="${esc(x.cover)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cv'}))">` : `<div class="cv"></div>`;
  return `<div class="song" data-id="${esc(x.id)}" data-lib="${x.inLib ? 1 : 0}">${cv}<div class="b"><div class="st1">${esc(x.title)}</div>${tr}<div class="st3">${esc(x.artist)}<span class="sync">${syncIcon(x.sync || (x.synced === false ? "est" : "sync"), !!store.get("kf:sp:" + x.id, null)?.length)}</span></div></div></div>`;
}
function renderLib() {
  const q = $("#libSearch").value.trim().toLowerCase(), { lib, mine } = libSongs();
  const f = (x) => !q || [x.title, x.artist, x.titleLat, x.titleDe].join(" ").toLowerCase().includes(q);
  const a = lib.filter(f), b = mine.filter(f);
  $("#libCount").textContent = library.map ? `${lib.length} Songs aus deiner Playlist` + (mine.length ? ` · ${mine.length} weitere` : "") : "Zugangscode in den Einstellungen eintragen";
  $("#libList").innerHTML = (a.length ? a.map((x, i) => songRow(x, i + 1)).join("") : "")
    + (b.length ? `<div class="lib-sec">Auf diesem Gerät übersetzt</div>` + b.map((x, i) => songRow(x, i + 1)).join("") : "")
    + (!a.length && !b.length ? `<div class="lib-sec">Keine Songs gefunden</div>` : "");
  $("#libList").querySelectorAll(".song").forEach(el => el.onclick = () => openSong(el.dataset.id, el.dataset.lib === "1"));
  markNow();
}
function markNow() { const id = current.meta?.ids?.[0]; document.querySelectorAll("#libList .song").forEach(el => el.classList.toggle("now", el.dataset.id === id)); }
async function openSong(id, inLib) {
  $("#lib").classList.remove("open");
  if (tok) {                          // play it in Spotify (inside the playlist, so the next songs follow); the lyrics follow by polling
    const body = inLib ? { context_uri: PLAYLIST_URI, offset: { uri: "spotify:track:" + id } } : { uris: ["spotify:track:" + id] };
    try {
      await sp("/me/player/play", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      setTimeout(pollSpotify, 400); setTimeout(pollSpotify, 1200); return;
    } catch (e) { setStatus(/active device|NO_ACTIVE_DEVICE|404/i.test(e.message) ? "Öffne Spotify kurz auf einem Gerät, dann nochmal tippen" : e.message); return; }
  }
  const e = library.map?.[id];        // without Spotify: show the lyrics with the built-in timer
  if (!e) { setStatus("Zum Abspielen Spotify verbinden"); return; }
  clearInterval(pollTimer); clock.source = "local"; document.body.classList.add("local", "playing-ui");
  const dur = (e.lines.at(-1)?.[0] || 0) + 15000; clock.durationMs = dur; clock.set(0, false);
  loadTrack({ key: "sp:" + id, ids: [id], title: e.title, artist: e.artist, firstArtist: e.artist, album: "", durationMs: dur, image: "" });
}
$("#btnLib").onclick = () => { $("#libSearch").value = ""; renderLib(); $("#lib").classList.add("open"); $("#lib").scrollTop = 0; };
$("#libClose").onclick = () => $("#lib").classList.remove("open");
$("#libSearch").oninput = renderLib;

/* ---------- settings ---------- */
$("#optCover").onchange = (e) => { cfg.cover = e.target.checked; saveCfg(); setBackground(current.meta?.image); };
function applyToggles() { $("#optCover").checked = cfg.cover; document.body.classList.toggle("no-lat", !cfg.lat); document.body.classList.toggle("no-de", !cfg.de); $("#optLat").checked = cfg.lat; $("#optDe").checked = cfg.de; }
$("#optLat").onchange = (e) => { cfg.lat = e.target.checked; saveCfg(); applyToggles(); };
$("#optDe").onchange = (e) => { cfg.de = e.target.checked; saveCfg(); applyToggles(); };
const showOff = () => $("#kfInfo").textContent = kfs.length ? kfs.map(([r, o]) => `${fmt(r)} ${fmtOff(o)}`).join(" · ") : "keine – Original-Timing";
$("#kfReset").onclick = () => { clearTimeout(pendingTimer); pending = null; kfs = []; setTimeout(updateBadge); saveKeyframes(); store.del("off:" + current.key); current.idx = -2; showOff(); setStatus("Timing zurückgesetzt"); };
$("#sKey").onchange = () => { cfg.apiKey = $("#sKey").value.trim(); saveCfg(); if (current.meta && current.lyrics && !current.gloss) loadTrack(current.meta); };
$("#sCode").onchange = async () => { cfg.code = $("#sCode").value.trim(); saveCfg(); if (await unlockLibrary(cfg.code) && current.meta) loadTrack(current.meta); };
$("#sModel").onchange = () => { cfg.model = $("#sModel").value; saveCfg(); };
$("#btnSpotify").onclick = () => spotifyLogin();
$("#btnClearCache").onclick = (e) => { e.preventDefault(); store.keys("gloss2:").forEach(store.del); $("#cacheInfo").textContent = "0 Songs gespeichert"; };
$("#btnSettings").onclick = () => {
  $("#sKey").value = cfg.apiKey; $("#sCode").value = cfg.code || ""; $("#sModel").value = cfg.model; showOff(); updateSpState();
  $("#cacheInfo").textContent = store.keys("gloss2:").length + " Songs gespeichert"; $("#settings").showModal();
};
$("#settings").addEventListener("click", (e) => { if (e.target === $("#settings")) $("#settings").close(); });   // tap outside closes

/* manual search (no Spotify) */
$("#q").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const q = $("#q").value.trim(); if (!q) return;
  $("#results").innerHTML = '<div class="item"><span>Suche …</span></div>';
  try {
    const list = (await (await fetch(`${LRCLIB}/search?q=${encodeURIComponent(q)}`)).json()).filter(x => x.syncedLyrics || x.plainLyrics).slice(0, 12);
    $("#results").innerHTML = list.length ? list.map((x, k) => `<div class="item" data-k="${k}"><span>${esc(x.trackName)}<small>${esc(x.artistName)} · ${fmt(x.duration * 1000)}</small></span></div>`).join("")
      : '<div class="item"><span>Nichts gefunden</span></div>';
    $("#results").querySelectorAll("[data-k]").forEach(el => el.onclick = () => {
      const x = list[+el.dataset.k], key = "lrclib:" + x.id;
      store.set("lyr2:" + key, recToLyrics(x));
      clearInterval(pollTimer); clock.source = "local"; document.body.classList.add("local", "playing-ui");
      clock.durationMs = x.duration * 1000; clock.set(0, false);
      loadTrack({ key, title: x.trackName, artist: x.artistName, firstArtist: x.artistName, album: x.albumName || "", durationMs: x.duration * 1000, image: "" });
      $("#settings").close();
    });
  } catch (err) { $("#results").innerHTML = `<div class="item"><span>Fehler: ${esc(err.message)}</span></div>`; }
});

(async function init() {
  applyToggles();
  const hc = new URLSearchParams(location.hash.slice(1)).get("code");
  if (hc) { cfg.code = hc; saveCfg(); history.replaceState(null, "", location.pathname + location.search); }
  if (cfg.code && await unlockLibrary(cfg.code)) setStatus(library.count + " Songs aus deiner Playlist bereit");
  await handleRedirect();
  if (tok) { startPolling(); showEmpty("Starte einen Song in Spotify."); }
  if (tok && !cfg.apiKey && !library.map) setStatus("Tipp: Zugangscode in den Einstellungen eintragen", true);
  document.addEventListener("click", requestWakeLock, { once: true });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  requestAnimationFrame(tick);
})();
</script>
</body>
